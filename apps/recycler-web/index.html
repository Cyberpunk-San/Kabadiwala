<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recycler Console | Mai Hu Kabadiwala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:#0f3d2e; --primary-mid:#164e3b; --primary-light:#e8f5ee;
      --accent:#d97706; --bg:#f4f7f4; --card:#fff; --ink:#0f1c14;
      --muted:#5c7469; --line:#dce5de; --green:#16a34a;
      --green-light:#dcfce7; --red:#dc2626; --red-light:#fee2e2;
      --amber:#f59e0b; --amber-light:#fef3c7; --radius:14px;
      --shadow:0 2px 16px rgba(15,60,46,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 60px;display:flex;justify-content:center}
    .wrap{width:100%;max-width:900px}
    header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-mid) 100%);border-radius:20px;padding:20px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 24px rgba(15,61,46,.2)}
    .brand-name{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px}
    .brand-sub{font-size:10px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
    .header-right{display:flex;gap:10px;align-items:center}
    .live-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#a7f3cc;font-size:10px;font-weight:700;padding:6px 12px;border-radius:50px;letter-spacing:.5px}
    .live-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

    /* Account bar */
    .account{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .account-avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .account-name{font-size:15px;font-weight:900}
    .account-id{font-size:10px;color:var(--muted);font-family:monospace;margin-top:2px}

    /* Tabs */
    .tabs{display:flex;gap:6px;margin-bottom:16px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
    .tab{flex:1;min-width:100px;padding:9px 14px;font-size:11px;font-weight:800;color:var(--muted);background:none;border:none;border-radius:10px;cursor:pointer;font-family:inherit;letter-spacing:.2px;white-space:nowrap}
    .tab:hover{background:#f5f8f5}
    .tab.active{background:var(--primary);color:#fff}

    /* Card */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
    .kicker{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    h2{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.4px;margin-bottom:14px}
    h3{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px}
    .muted{font-size:11px;color:var(--muted)}

    /* Inputs */
    .field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    .field-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
    input,select,textarea{font-family:inherit;font-size:14px;font-weight:700;padding:12px 14px;border:2px solid var(--line);border-radius:11px;background:#f8faf9;color:var(--ink);outline:none;transition:border-color .2s;width:100%}
    input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff}
    textarea{resize:vertical;min-height:60px}
    input.price{padding:8px 10px;font-size:13px;max-width:130px}

    button{font-family:inherit;font-size:13px;font-weight:800;padding:12px 20px;border:none;border-radius:11px;cursor:pointer;transition:background .15s,transform .08s;background:var(--primary);color:#fff;letter-spacing:.2px}
    button:hover{background:var(--primary-mid)}
    button:active{transform:scale(.98)}
    button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
    button.secondary{background:var(--primary-light);color:var(--primary)}
    button.secondary:hover{background:#d3ebdc}
    button.danger{background:var(--red-light);color:var(--red)}
    button.small{padding:8px 14px;font-size:11px}
    button.link{background:none;color:var(--primary);padding:6px 0;text-decoration:underline}

    .btn-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
    .btn-row button{flex:1}

    /* Alerts */
    .alert{padding:12px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:12px}
    .alert.error{background:var(--red-light);color:#991b1b;border:1px solid #fca5a5}
    .alert.info{background:var(--primary-light);color:var(--primary);border:1px solid #b6dcc7}
    .alert.warning{background:var(--amber-light);color:#92400e;border:1px solid #fcd34d}
    .alert.success{background:var(--green-light);color:#15803d;border:1px solid #86efac}

    /* Tables */
    .table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#f8faf9;color:var(--ink);font-weight:800;font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
    th:first-child{border-radius:8px 0 0 0}
    th:last-child{border-radius:0 8px 0 0}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr:last-child td{border:none}
    tr:hover td{background:#fafdfa}

    /* Badges */
    .badge{display:inline-flex;padding:3px 8px;border-radius:50px;font-size:9px;font-weight:800;letter-spacing:.3px}
    .badge-green{background:var(--green-light);color:#15803d}
    .badge-amber{background:var(--amber-light);color:#92400e}
    .badge-red{background:var(--red-light);color:#991b1b}
    .badge-gray{background:#f3f4f6;color:#374151}
    .badge-blue{background:#dbeafe;color:#1e40af}

    /* KPI */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
    .kpi{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px}
    .kpi-icon{font-size:18px;margin-bottom:4px}
    .kpi-label{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
    .kpi-value{font-size:19px;font-weight:900;color:var(--ink);margin-top:5px;letter-spacing:-.4px}
    .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px}

    /* Detail grid */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .detail-item label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
    .detail-item .val{font-size:14px;font-weight:800;color:var(--ink);margin-top:3px}
    .detail-item .val.green{color:var(--green)}
    .detail-item .val.mono{font-family:monospace;font-size:12px}

    /* Progress */
    .progress{height:6px;border-radius:3px;background:#eef2ee;overflow:hidden;margin-top:4px;min-width:80px}
    .progress>div{height:100%;background:var(--green)}

    .hidden{display:none !important}
    .loading{text-align:center;color:var(--muted);font-size:12px;padding:30px}
    .error-msg{text-align:center;color:var(--red);font-size:12px;padding:30px}

    @media(max-width:600px){
      .detail-grid,.field-grid{grid-template-columns:1fr}
      .btn-row{flex-direction:column}
      .tabs{flex-wrap:nowrap}
    }
    .scan-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .scan-row button{flex:1;min-width:140px}
    .scan-box{position:relative;margin-bottom:14px;border-radius:12px;overflow:hidden;background:#000}
    .scan-box video{display:block;width:100%;max-height:340px;object-fit:cover}
    .scan-box .frame{position:absolute;inset:18% 22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
    .scan-box button{position:absolute;right:10px;bottom:10px;width:auto}
    .or-sep{text-align:center;color:#888;font-size:12px;margin:4px 0 12px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-name">♻ Mai Hu Kabadiwala</div>
      <div class="brand-sub">Recycler Console</div>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
    </div>
  </header>

  <div id="account-card" class="card" style="padding:14px 18px"></div>

  <div id="tabs" class="tabs hidden">
    <button class="tab active" data-tab="verify" onclick="switchTab('verify')">✓ Verify</button>
    <button class="tab" data-tab="incoming" onclick="switchTab('incoming')">📥 Incoming</button>
    <button class="tab" data-tab="demands" onclick="switchTab('demands')">📣 Demands</button>
    <button class="tab" data-tab="offers" onclick="switchTab('offers')">💰 Offers</button>
    <button class="tab" data-tab="demands" onclick="switchTab('demands')">📢 Demands</button>
    <button class="tab" data-tab="prices" onclick="switchTab('prices')">🏷 Prices</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">📜 History</button>
    <button class="tab" data-tab="analytics" onclick="switchTab('analytics')">📊 Analytics</button>
  </div>

  <div id="content">
    <div class="loading">Loading…</div>
  </div>
</div>

<script src="vendor/jsQR.js"></script>
<script>
  // Same machine that served this page, port 8000 — so the portal works from any device on the network.
  // Override with ?api=http://host:port when the API lives elsewhere (e.g. a tunnel URL).
  const API_BASE = new URLSearchParams(location.search).get("api")
    || `${location.protocol === "https:" ? "https:" : "http:"}//${!location.hostname || location.hostname === "localhost" ? "127.0.0.1" : location.hostname}:8000`;
  const ACCOUNT_KEY = "mhk_recycler_account";
  const DEMO_RECYCLERS = ["eco-cycle", "green-loop", "urban-recover", "maha-e-metals"];
  const QUALITIES = ["low", "medium", "high"];

  let currentTab = "verify";
  let currentLot = null;
  let loginMode = "login"; // login | register
  // { id, name, active, phone? } — the recycler this console acts as.
  let account = null;

  function money(n) {
    if (n >= 1_00_00_000) return "₹" + (n / 1_00_00_000).toFixed(2) + " Cr";
    if (n >= 1_00_000) return "₹" + (n / 1_00_000).toFixed(2) + " L";
    return "₹" + Math.round(n).toLocaleString("en-IN");
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function dateIN(iso) { return iso ? new Date(iso.endsWith("Z") ? iso : iso + "Z").toLocaleDateString("en-IN") : "—"; }
  async function api(path, opts) {
    const res = await fetch(`${API_BASE}${path}`, opts);
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).detail; } catch { /* not JSON */ }
      const msg = typeof detail === "string" && detail ? detail : Array.isArray(detail) ? detail.map(d => d.msg).join("; ") : `${res.status} ${path}`;
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }
  const json = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  function getRecyclerId() { return account.id; }

  // ─── Account ─────────────────────────────────────────────────────────────
  function saveAccount(a) {
    account = a;
    try { a ? localStorage.setItem(ACCOUNT_KEY, JSON.stringify(a)) : localStorage.removeItem(ACCOUNT_KEY); } catch { /* storage blocked */ }
  }

  /** Re-read name + approval from the server (an admin may have approved us since). */
  async function refreshAccount() {
    if (!account) return;
    try {
      const p = await api(`/api/v1/recycler/${encodeURIComponent(account.id)}/prices`);
      saveAccount({ ...account, name: p.recycler_name, active: p.is_active });
    } catch (err) {
      if (err.status === 404) saveAccount(null);
    }
  }

  function renderAccountCard() {
    const el = document.getElementById("account-card");
    if (!account) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    el.innerHTML = `
      <div class="account">
        <div class="account-avatar">🏭</div>
        <div style="flex:1;min-width:160px">
          <div class="account-name">${esc(account.name)}</div>
          <div class="account-id">${esc(account.id)}${account.phone ? " · " + esc(account.phone) : ""}</div>
        </div>
        <span class="badge ${account.active ? "badge-green" : "badge-amber"}">${account.active ? "APPROVED" : "AWAITING APPROVAL"}</span>
        <button class="small secondary" onclick="signOut()">Switch account</button>
      </div>
      ${account.active ? "" : `<div class="alert warning" style="margin:12px 0 0">Your company is waiting for admin approval. You can look around, but posting demand, making offers, setting prices and settling handovers unlock once approved.</div>`}
    `;
  }

  function renderLogin() {
    return `
      <div class="card">
        <p class="kicker">Buyer / Recycler Sign-in</p>
        <h2>${loginMode === "login" ? "Sign in to your console" : "Register your recycling company"}</h2>
        <div id="login-error" class="alert error hidden"></div>
        ${loginMode === "login" ? `
          <div class="field-row">
            <label class="field-label">Registered phone number</label>
            <input id="loginPhone" placeholder="+91 98xxxxxxxx" inputmode="tel" autocomplete="tel" />
          </div>
          <button id="btn-login" onclick="loginByPhone()">Sign in →</button>
          <p class="muted" style="margin-top:12px">Registered as a buyer company in the app? Use the same phone. New here?
            <button class="link" onclick="loginMode='register';render()">Register your company</button></p>
        ` : `
          <div class="field-grid">
            <div class="field-row"><label class="field-label">Company name *</label><input id="regName" maxlength="120" /></div>
            <div class="field-row"><label class="field-label">Phone *</label><input id="regPhone" inputmode="tel" placeholder="+91 98xxxxxxxx" /></div>
            <div class="field-row"><label class="field-label">Contact person</label><input id="regContact" maxlength="80" /></div>
            <div class="field-row"><label class="field-label">Company type</label>
              <select id="regType"><option value="buyer">We buy scrap (recycler)</option><option value="both">We buy and also have e-waste</option></select></div>
            <div class="field-row"><label class="field-label">GSTIN</label><input id="regGstin" maxlength="15" placeholder="27ABCDE1234F1Z5" /></div>
            <div class="field-row"><label class="field-label">CPCB authorisation no.</label><input id="regCpcb" maxlength="40" /></div>
          </div>
          <div class="field-row"><label class="field-label">Address</label><input id="regAddress" maxlength="200" /></div>
          <button id="btn-register" onclick="registerCompany()">Register company →</button>
          <p class="muted" style="margin-top:12px">An admin checks your CPCB authorisation before you go live.
            <button class="link" onclick="loginMode='login';render()">I already have an account</button></p>
        `}
      </div>
      <div class="card">
        <p class="kicker">Demo</p>
        <h3>Try a sample recycler</h3>
        <div class="btn-row">
          ${DEMO_RECYCLERS.map(id => `<button class="small secondary" onclick="useDemo('${id}')">${esc(id)}</button>`).join("")}
        </div>
      </div>
    `;
  }

  function showLoginError(msg) {
    const el = document.getElementById("login-error");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  function companyToAccount(c) {
    return { id: c.id, name: c.name, active: !!c.approved, phone: c.phone };
  }

  async function loginByPhone() {
    const phone = document.getElementById("loginPhone").value.trim();
    if (phone.replace(/\D/g, "").length < 10) return showLoginError("Enter a 10-digit phone number.");
    const btn = document.getElementById("btn-login"); btn.disabled = true;
    try {
      const r = await api("/api/v1/auth/login", json("POST", { phone }));
      if (r.role !== "company" || !r.company) {
        return showLoginError(r.role === "kabadiwala" ? "This number belongs to a kabadiwala — use the mobile app." : "This number belongs to a household — use the mobile app.");
      }
      if (r.company.company_type === "seller") {
        return showLoginError("This company is registered as an e-waste seller, not a buyer. Request pickups from the mobile app instead.");
      }
      saveAccount(companyToAccount(r.company));
      await refreshAccount();
      render();
    } catch (err) {
      showLoginError(err.status === 404 ? "No account with this number. Register your company below." : "❌ " + err.message);
    } finally { btn.disabled = false; }
  }

  async function registerCompany() {
    const val = id => document.getElementById(id).value.trim();
    const name = val("regName"), phone = val("regPhone");
    if (name.length < 2) return showLoginError("Enter the company name.");
    if (phone.replace(/\D/g, "").length < 10) return showLoginError("Enter a 10-digit phone number.");
    const btn = document.getElementById("btn-register"); btn.disabled = true;
    try {
      const c = await api("/api/v1/companies/register", json("POST", {
        name, phone,
        contact_name: val("regContact") || null,
        company_type: val("regType"),
        gstin: val("regGstin") || null,
        cpcb_license: val("regCpcb") || null,
        address: val("regAddress") || null,
      }));
      if (c.company_type === "seller") return showLoginError("This phone is already registered as an e-waste seller.");
      saveAccount(companyToAccount(c));
      await refreshAccount();
      render();
    } catch (err) {
      showLoginError("❌ " + err.message);
    } finally { btn.disabled = false; }
  }

  async function useDemo(id) {
    saveAccount({ id, name: id, active: true });
    await refreshAccount();
    render();
  }

  function signOut() {
    saveAccount(null);
    currentTab = "verify";
    render();
  }

  function needsApproval() {
    return account && !account.active
      ? `<div class="alert warning">Available after admin approval.</div>`
      : "";
  }

  function switchTab(tab) {
    stopCameraScan();
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    render();
  }

  // ─── VERIFY TAB ──────────────────────────────────────────────────────────
  function renderVerify() {
    return `
      ${needsApproval()}
      <div class="card">
        <p class="kicker">Verify Incoming Lot</p>
        <h2>Scan the pass or enter Lot ID & PIN</h2>
        <div id="verify-error" class="alert error hidden"></div>
        <div class="scan-row">
          <button class="secondary" onclick="startCameraScan()">📷 Scan QR with camera</button>
          <button class="secondary" onclick="document.getElementById('qrPhoto').click()">🖼 Scan from photo</button>
          <input id="qrPhoto" type="file" accept="image/*" capture="environment" hidden onchange="scanPhoto(this)" />
        </div>
        <div id="scan-box" class="scan-box hidden">
          <video id="scan-video" playsinline muted></video>
          <div class="frame"></div>
          <button class="secondary" onclick="stopCameraScan()">Cancel</button>
        </div>
        <p class="or-sep">or type it</p>
        <div class="field-row">
          <label class="field-label">Lot ID</label>
          <input id="lotIdInput" placeholder="e.g. lot_demo_copper_01" autocomplete="off" />
        </div>
        <div class="field-row">
          <label class="field-label">4-Digit Pickup PIN</label>
          <input id="pinInput" placeholder="• • • •" maxlength="4" inputmode="numeric" autocomplete="off" />
        </div>
        <button id="btn-verify" onclick="verifyLot()">Verify PIN →</button>
      </div>
      <div id="settle-section"></div>
      <div id="success-section"></div>
    `;
  }

  // ─── QR SCAN ─────────────────────────────────────────────────────────────
  // The kabadiwala's handover pass encodes {"lotId": "...", "pin": "1234"}.
  let scanStream = null;

  function showVerifyError(msg) {
    const el = document.getElementById("verify-error");
    el.textContent = msg; el.classList.remove("hidden");
  }

  function applyScan(text) {
    let lotId, pin;
    try { ({ lotId, pin } = JSON.parse(text)); } catch { /* not our QR */ }
    if (!lotId || !/^\d{4}$/.test(String(pin ?? ""))) { showVerifyError("❌ This QR is not a Mai Hu Kabadiwala handover pass."); return false; }
    document.getElementById("lotIdInput").value = lotId;
    document.getElementById("pinInput").value = pin;
    verifyLot();
    return true;
  }

  function decodeFrom(source, w, h) {
    const scale = Math.min(1, 1000 / Math.max(w, h));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
  }

  async function startCameraScan() {
    document.getElementById("verify-error").classList.add("hidden");
    // Browsers only allow the live camera on https or localhost; on a LAN address use the photo option.
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
      document.getElementById("qrPhoto").click();
      return;
    }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch {
      showVerifyError("Camera not available — use “Scan from photo” or type the Lot ID and PIN.");
      return;
    }
    const video = document.getElementById("scan-video");
    video.srcObject = scanStream;
    await video.play();
    document.getElementById("scan-box").classList.remove("hidden");
    const tick = () => {
      if (!scanStream) return;
      if (video.readyState >= 2) {
        const code = decodeFrom(video, video.videoWidth, video.videoHeight);
        if (code) { stopCameraScan(); applyScan(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function stopCameraScan() {
    scanStream?.getTracks().forEach(t => t.stop());
    scanStream = null;
    document.getElementById("scan-box")?.classList.add("hidden");

  function scanPhoto(input) {
    const file = input.files?.[0];
    input.value = "";
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const code = decodeFrom(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(img.src);
      if (code) applyScan(code.data);
      else showVerifyError("❌ No QR found in that photo. Hold the phone closer, with the whole QR in view.");
    };
    img.src = URL.createObjectURL(file);
  }

          <div class="table-scroll"><table>
            <thead><tr><th>Material</th><th>Mandi rate</th><th>Your price</th></tr></thead>
            <tbody>
              ${rows.map(([m, v]) => `
                <tr>
                  <td><strong>${esc(m)}</strong></td>
                  <td class="muted">${mandi[m] != null ? money(mandi[m]) : "—"}</td>
                  <td><input class="price" type="number" min="0.5" step="0.5" data-material="${esc(m)}" value="${v}" ${p.is_active ? "" : "disabled"} /></td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
          <button id="btn-prices" style="margin-top:14px" onclick="savePrices()" ${p.is_active ? "" : "disabled"}>Save prices</button>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  async function savePrices() {
    const msg = document.getElementById("price-msg");
    const prices = {};
    for (const input of document.querySelectorAll("input.price")) {
      const v = parseFloat(input.value);
      if (!(v > 0)) { msg.className = "alert error"; msg.textContent = `Enter a valid price for ${input.dataset.material}.`; return; }
      prices[input.dataset.material] = v;
    }
    const btn = document.getElementById("btn-prices"); btn.disabled = true;
    try {
      await api(`/api/v1/recycler/${encodeURIComponent(getRecyclerId())}/prices`, json("PUT", { prices }));
      msg.className = "alert success"; msg.textContent = "✓ Prices saved — live in the marketplace.";
    } catch (err) {
      msg.className = "alert error"; msg.textContent = "❌ " + err.message;
    } finally { btn.disabled = false; }
  }

  // ─── HISTORY TAB ─────────────────────────────────────────────────────────
  async function renderHistory() {
    try {
      const tx = await api(`/api/v1/recycler/${getRecyclerId()}/transactions`);
      if (tx.length === 0) return `<div class="card"><p class="loading">No settled handovers yet</p></div>`;
      return `
        <div class="card">
          <p class="kicker">Transaction History</p>
          <h2>${tx.length} settled lot${tx.length > 1 ? "s" : ""}</h2>
          <div class="table-scroll"><table>
            <thead><tr><th>UTR</th><th>Lot</th><th>Weight</th><th>Amount</th><th>EPR Cert</th><th>Mode</th><th>Date</th></tr></thead>
            <tbody>
              ${tx.map(t => `
                <tr>
                  <td style="font-family:monospace;font-size:10px">${esc(t.utr_number)}</td>
                  <td style="font-family:monospace;font-size:10px">${esc(t.lot_id)}</td>
                  <td>${t.audited_weight_kg} kg</td>
                  <td><strong>${money(t.amount_paid)}</strong></td>
                  <td style="font-family:monospace;font-size:9px">${esc(t.epr_certificate_id || "—")}</td>
                  <td>${esc(t.payment_mode)}</td>
                  <td>${new Date(t.created_at).toLocaleDateString("en-IN")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  // ─── ANALYTICS TAB ───────────────────────────────────────────────────────
  async function renderAnalytics() {
    try {
      const a = await api(`/api/v1/recycler/${getRecyclerId()}/analytics`);
      return `
        <div class="kpi-grid">
          <div class="kpi" style="border-left-color:#16a34a"><div class="kpi-icon">📦</div><div class="kpi-label">Handovers</div><div class="kpi-value">${a.total_handovers}</div></div>
          <div class="kpi" style="border-left-color:#f59e0b"><div class="kpi-icon">⚖️</div><div class="kpi-label">Total Weight</div><div class="kpi-value">${a.total_kg} kg</div></div>
          <div class="kpi" style="border-left-color:#059669"><div class="kpi-icon">💰</div><div class="kpi-label">Paid Volume</div><div class="kpi-value">${money(a.total_paid_inr)}</div></div>
          <div class="kpi" style="border-left-color:#8b5cf6"><div class="kpi-icon">📊</div><div class="kpi-label">Avg ₹/kg</div><div class="kpi-value">${money(a.avg_price_per_kg)}</div></div>
          <div class="kpi" style="border-left-color:#3b82f6"><div class="kpi-icon">💼</div><div class="kpi-label">Open Offers</div><div class="kpi-value">${a.open_offers}</div><div class="kpi-sub">${a.accepted_offers} accepted</div></div>
          <div class="kpi" style="border-left-color:#f97316"><div class="kpi-icon">📥</div><div class="kpi-label">Incoming</div><div class="kpi-value">${a.incoming_lots_pending}</div><div class="kpi-sub">available lots</div></div>
        </div>
        <div class="card">
          <p class="kicker">Top Material</p>
          <h2>${esc(a.top_material || "—")}</h2>
          <p style="font-size:11px;color:var(--muted)">Highest lifetime intake by weight</p>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  // ─── RENDER ──────────────────────────────────────────────────────────────
  async function render() {
    renderAccountCard();
    document.getElementById("tabs").classList.toggle("hidden", !account);
    const el = document.getElementById("content");
    if (!account) { el.innerHTML = renderLogin(); return; }

    el.innerHTML = `<div class="loading">Loading…</div>`;
    let html = "";
    try {
      if (currentTab === "verify") html = renderVerify();
      else if (currentTab === "incoming") html = await renderIncoming();
      else if (currentTab === "demands") html = await renderDemands();
      else if (currentTab === "offers") html = await renderOffers();
      else if (currentTab === "demands") html = await renderDemands();
      else if (currentTab === "prices") html = await renderPrices();
      else if (currentTab === "history") html = await renderHistory();
      else if (currentTab === "analytics") html = await renderAnalytics();
      el.innerHTML = html;
    } catch (err) {
      el.innerHTML = `<div class="card"><p class="error-msg">Error: ${esc(err.message)}</p></div>`;
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    try { account = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "null"); } catch { account = null; }
    await refreshAccount();
    render();
  });
</script>
</body>
</html>
