<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recycler Console | Mai Hu Kabadiwala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:#0f3d2e; --primary-mid:#164e3b; --primary-light:#e8f5ee;
      --accent:#d97706; --bg:#f4f7f4; --card:#fff; --ink:#0f1c14;
      --muted:#5c7469; --line:#dce5de; --green:#16a34a;
      --green-light:#dcfce7; --red:#dc2626; --red-light:#fee2e2;
      --amber:#f59e0b; --amber-light:#fef3c7; --radius:14px;
      --shadow:0 2px 16px rgba(15,60,46,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 60px;display:flex;justify-content:center}
    .wrap{width:100%;max-width:900px}
    header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-mid) 100%);border-radius:20px;padding:20px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 24px rgba(15,61,46,.2)}
    .brand-name{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px}
    .brand-sub{font-size:10px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
    .header-right{display:flex;gap:10px;align-items:center}
    .live-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#a7f3cc;font-size:10px;font-weight:700;padding:6px 12px;border-radius:50px;letter-spacing:.5px}
    .live-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

    /* Tabs */
    .tabs{display:flex;gap:6px;margin-bottom:16px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
    .tab{flex:1;min-width:100px;padding:9px 14px;font-size:11px;font-weight:800;color:var(--muted);background:none;border:none;border-radius:10px;cursor:pointer;font-family:inherit;letter-spacing:.2px;white-space:nowrap}
    .tab.active{background:var(--primary);color:#fff}

    /* Card */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
    .kicker{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    h2{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.4px;margin-bottom:14px}
    h3{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px}

    /* Inputs */
    .field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
    input,select{font-family:inherit;font-size:14px;font-weight:700;padding:12px 14px;border:2px solid var(--line);border-radius:11px;background:#f8faf9;color:var(--ink);outline:none;transition:border-color .2s;width:100%}
    input:focus,select:focus{border-color:var(--primary);background:#fff}

    button{font-family:inherit;font-size:13px;font-weight:800;padding:12px 20px;border:none;border-radius:11px;cursor:pointer;transition:background .15s,transform .08s;background:var(--primary);color:#fff;letter-spacing:.2px}
    button:hover{background:var(--primary-mid)}
    button:active{transform:scale(.98)}
    button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
    button.secondary{background:var(--primary-light);color:var(--primary)}
    button.secondary:hover{background:#d3ebdc}
    button.danger{background:var(--red-light);color:var(--red)}
    button.small{padding:8px 14px;font-size:11px}

    .btn-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
    .btn-row button{flex:1}

    /* Alerts */
    .alert{padding:12px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:12px}
    .alert.error{background:var(--red-light);color:#991b1b;border:1px solid #fca5a5}
    .alert.info{background:var(--primary-light);color:var(--primary);border:1px solid #b6dcc7}
    .alert.warning{background:var(--amber-light);color:#92400e;border:1px solid #fcd34d}
    .alert.success{background:var(--green-light);color:#15803d;border:1px solid #86efac}

    /* Tables */
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#f8faf9;color:var(--ink);font-weight:800;font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
    th:first-child{border-radius:8px 0 0 0}
    th:last-child{border-radius:0 8px 0 0}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr:last-child td{border:none}
    tr:hover td{background:#fafdfa}

    /* Badges */
    .badge{display:inline-flex;padding:3px 8px;border-radius:50px;font-size:9px;font-weight:800;letter-spacing:.3px}
    .badge-green{background:var(--green-light);color:#15803d}
    .badge-amber{background:var(--amber-light);color:#92400e}
    .badge-red{background:var(--red-light);color:#991b1b}
    .badge-gray{background:#f3f4f6;color:#374151}
    .badge-blue{background:#dbeafe;color:#1e40af}

    /* KPI */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
    .kpi{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px}
    .kpi-icon{font-size:18px;margin-bottom:4px}
    .kpi-label{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
    .kpi-value{font-size:19px;font-weight:900;color:var(--ink);margin-top:5px;letter-spacing:-.4px}
    .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px}

    /* Detail grid */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .detail-item label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
    .detail-item .val{font-size:14px;font-weight:800;color:var(--ink);margin-top:3px}
    .detail-item .val.green{color:var(--green)}
    .detail-item .val.mono{font-family:monospace;font-size:12px}

    .hidden{display:none !important}
    .loading{text-align:center;color:var(--muted);font-size:12px;padding:30px}
    .error-msg{text-align:center;color:var(--red);font-size:12px;padding:30px}

    @media(max-width:600px){
      .detail-grid{grid-template-columns:1fr}
      .btn-row{flex-direction:column}
      .tabs{flex-wrap:nowrap}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-name">♻ Mai Hu Kabadiwala</div>
      <div class="brand-sub">Recycler Console</div>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
    </div>
  </header>

  <!-- Recycler selector -->
  <div class="card" style="padding:14px 18px">
    <div class="field-row" style="margin-bottom:0">
      <label class="field-label">Active Recycler ID</label>
      <input id="recyclerId" value="eco-cycle" onchange="onRecyclerChange()" />
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="verify" onclick="switchTab('verify')">✓ Verify</button>
    <button class="tab" data-tab="incoming" onclick="switchTab('incoming')">📥 Incoming</button>
    <button class="tab" data-tab="offers" onclick="switchTab('offers')">💰 Offers</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">📜 History</button>
    <button class="tab" data-tab="analytics" onclick="switchTab('analytics')">📊 Analytics</button>
  </div>

  <div id="content">
    <div class="loading">Loading…</div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";
  let currentTab = "verify";
  let currentLot = null;

  function money(n) {
    if (n >= 1_00_00_000) return "₹" + (n / 1_00_00_000).toFixed(2) + " Cr";
    if (n >= 1_00_000) return "₹" + (n / 1_00_000).toFixed(2) + " L";
    return "₹" + Math.round(n).toLocaleString("en-IN");
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  async function api(path, opts) {
    const res = await fetch(`${API_BASE}${path}`, opts);
    if (!res.ok) throw new Error(`${res.status} ${path}`);
    return res.json();
  }
  function getRecyclerId() { return document.getElementById("recyclerId").value.trim() || "eco-cycle"; }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    render();
  }
  function onRecyclerChange() { render(); }

  // ─── VERIFY TAB ──────────────────────────────────────────────────────────
  function renderVerify() {
    return `
      <div class="card">
        <p class="kicker">Verify Incoming Lot</p>
        <h2>Enter Lot ID & PIN</h2>
        <div id="verify-error" class="alert error hidden"></div>
        <div class="field-row">
          <label class="field-label">Lot ID</label>
          <input id="lotIdInput" placeholder="e.g. lot_demo_copper_01" autocomplete="off" />
        </div>
        <div class="field-row">
          <label class="field-label">4-Digit Pickup PIN</label>
          <input id="pinInput" placeholder="• • • •" maxlength="4" inputmode="numeric" autocomplete="off" />
        </div>
        <button id="btn-verify" onclick="verifyLot()">Verify PIN →</button>
      </div>
      <div id="settle-section"></div>
      <div id="success-section"></div>
    `;
  }

  async function verifyLot() {
    const el = document.getElementById("verify-error");
    el.classList.add("hidden");
    const lotId = document.getElementById("lotIdInput").value.trim();
    const pin = document.getElementById("pinInput").value.trim();
    if (!lotId) { el.textContent = "Enter a Lot ID."; el.classList.remove("hidden"); return; }
    if (!/^\d{4}$/.test(pin)) { el.textContent = "PIN must be 4 digits."; el.classList.remove("hidden"); return; }
    const btn = document.getElementById("btn-verify"); btn.disabled = true; btn.textContent = "Verifying…";
    try {
      const data = await api("/api/v1/handover/verify", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lot_id: lotId, pickup_pin: pin }),
      });
      currentLot = { ...data, pin };
      document.getElementById("settle-section").innerHTML = renderSettle();
      document.getElementById("success-section").innerHTML = "";
    } catch (err) {
      el.textContent = err.message.includes("401") ? "❌ Invalid PIN" : "❌ " + err.message;
      el.classList.remove("hidden");
    } finally { btn.disabled = false; btn.textContent = "Verify PIN →"; }
  }

  function renderSettle() {
    const d = currentLot;
    return `
      <div class="card">
        <p class="kicker">Verified Lot</p>
        <h2>${esc(d.lot_id)}</h2>
        <div class="detail-grid">
          <div class="detail-item"><label>Material</label><div class="val">${esc(d.material)}</div></div>
          <div class="detail-item"><label>Collector</label><div class="val">${esc(d.collector_name)}</div></div>
          <div class="detail-item"><label>Declared Weight</label><div class="val">${d.declared_weight_kg} kg</div></div>
          <div class="detail-item"><label>Expected Payout</label><div class="val green">${money(d.expected_net_earnings)}</div></div>
          <div class="detail-item"><label>Status</label><div class="val">${esc(d.status)}</div></div>
          <div class="detail-item"><label>Collector ID</label><div class="val mono">${esc(d.collector_id)}</div></div>
        </div>
      </div>
      <div class="card">
        <p class="kicker">Physical Audit</p>
        <h2>Enter Verified Weight</h2>
        <div id="audit-error" class="alert error hidden"></div>
        <div class="field-row">
          <label class="field-label">Verified Weight (kg)</label>
          <input id="weightInput" type="number" step="0.1" min="0.1" value="${d.declared_weight_kg}" />
        </div>
        <button id="btn-confirm" onclick="confirmSettle()">✓ Confirm Receipt & Release Payment</button>
      </div>
    `;
  }

  async function confirmSettle() {
    if (!currentLot) return;
    const el = document.getElementById("audit-error");
    el.classList.add("hidden");
    const weight = parseFloat(document.getElementById("weightInput").value);
    if (!weight || weight <= 0) { el.textContent = "Enter a valid weight."; el.classList.remove("hidden"); return; }
    const btn = document.getElementById("btn-confirm"); btn.disabled = true; btn.textContent = "Releasing…";
    try {
      const receipt = await api("/api/v1/handover/confirm", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lot_id: currentLot.lot_id,
          pickup_pin: currentLot.pin,
          recycler_id: getRecyclerId(),
          recycler_name: "EcoCycle Recyclers Pvt Ltd",
          audited_weight_kg: weight,
          agreed_payout: currentLot.expected_net_earnings || 0,
          payment_mode: "UPI",
        }),
      });
      document.getElementById("settle-section").innerHTML = "";
      document.getElementById("success-section").innerHTML = renderSuccess(receipt);
      currentLot = null;
    } catch (err) {
      el.textContent = "❌ " + err.message;
      el.classList.remove("hidden");
      btn.disabled = false; btn.textContent = "✓ Confirm Receipt & Release Payment";
    }
  }

  function renderSuccess(r) {
    return `
      <div class="card" style="background:linear-gradient(135deg,#0a3d26 0%,#1a6b45 100%);color:#fff;text-align:center">
        <div style="font-size:44px;margin-bottom:8px">✓</div>
        <div style="font-size:22px;font-weight:900;letter-spacing:-.4px">Handover Complete</div>
        <div style="font-size:12px;color:rgba(255,255,255,.65);margin-top:6px">Payment released · EPR credit generated</div>
        <div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:16px 20px;margin-top:20px;text-align:left;font-size:12px">
          <div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.55);font-weight:600">UTR</span><span style="font-family:monospace;font-weight:800">${esc(r.utr_number)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.55);font-weight:600">Amount</span><span style="font-weight:800">${money(r.amount_paid)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.55);font-weight:600">EPR</span><span style="font-family:monospace;font-weight:800;font-size:10px">${esc(r.epr_certificate_id)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.55);font-weight:600">Carbon Offset</span><span style="font-weight:800">${r.carbon_offset_kg} kg</span></div>
        </div>
        <button class="secondary" style="margin-top:18px" onclick="switchTab('verify')">Verify Another Lot</button>
      </div>
    `;
  }

  // ─── INCOMING TAB ────────────────────────────────────────────────────────
  async function renderIncoming() {
    try {
      const lots = await api(`/api/v1/recycler/${getRecyclerId()}/incoming-lots`);
      if (lots.length === 0) return `<div class="card"><p class="loading">No incoming lots available</p></div>`;
      return `
        <div class="card">
          <p class="kicker">Incoming Lots</p>
          <h2>${lots.length} available lots</h2>
          <table>
            <thead><tr><th>Lot ID</th><th>Material</th><th>Weight</th><th>Distance</th><th>Collector</th><th>Action</th></tr></thead>
            <tbody>
              ${lots.map(l => `
                <tr>
                  <td style="font-family:monospace;font-size:10px">${esc(l.id)}</td>
                  <td><strong>${esc(l.material)}</strong><br><span style="font-size:9px;color:var(--muted)">${esc(l.quality)}</span></td>
                  <td>${l.weight_kg} kg</td>
                  <td>${l.distance_km != null ? l.distance_km + " km" : "—"}</td>
                  <td>${esc(l.collector_name)}<br><span style="font-size:9px;color:var(--muted);font-family:monospace">${esc(l.collector_id)}</span></td>
                  <td>
                    <button class="small secondary" onclick="quickOffer('${esc(l.id)}')">Make Offer</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  async function quickOffer(lotId) {
    const priceStr = prompt("Offer price per kg (₹):", "620");
    if (!priceStr) return;
    const price = parseFloat(priceStr);
    if (!price || price <= 0) return alert("Invalid price");
    try {
      await api("/api/v1/recycler/offers", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          recycler_id: getRecyclerId(),
          lot_id: lotId,
          offered_price_per_kg: price,
          pickup_cost: 180, handling_cost: 70, platform_fee: 120,
          expires_in_hours: 48,
        }),
      });
      alert("Offer sent!");
      render();
    } catch (err) { alert("Failed: " + err.message); }
  }

  // ─── OFFERS TAB ──────────────────────────────────────────────────────────
  async function renderOffers() {
    try {
      const offers = await api(`/api/v1/recycler/${getRecyclerId()}/offers`);
      if (offers.length === 0) return `<div class="card"><p class="loading">No offers yet — create one from the Incoming tab</p></div>`;
      return `
        <div class="card">
          <p class="kicker">My Offers</p>
          <h2>${offers.length} total</h2>
          <table>
            <thead><tr><th>Offer ID</th><th>Lot</th><th>₹/kg</th><th>Net</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${offers.map(o => `
                <tr>
                  <td style="font-family:monospace;font-size:10px">${esc(o.id)}</td>
                  <td style="font-family:monospace;font-size:10px">${esc(o.lot_id)}</td>
                  <td>${money(o.offered_price_per_kg)}</td>
                  <td>${money(o.net_earnings)}</td>
                  <td><span class="badge ${
                    o.status === "ACCEPTED" ? "badge-green" :
                    o.status === "REJECTED" ? "badge-red" :
                    o.status === "EXPIRED"  ? "badge-gray"  : "badge-amber"
                  }">${esc(o.status)}</span></td>
                  <td>
                    ${o.status === "PENDING" ? `
                      <button class="small" onclick="setOffer('${o.id}','accept')">Accept</button>
                      <button class="small danger" onclick="setOffer('${o.id}','reject')">Reject</button>
                    ` : "—"}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  async function setOffer(offerId, action) {
    try {
      await api(`/api/v1/recycler/offers/${offerId}/${action}`, { method: "PATCH" });
      render();
    } catch (err) { alert("Failed: " + err.message); }
  }

  // ─── HISTORY TAB ─────────────────────────────────────────────────────────
  async function renderHistory() {
    try {
      const tx = await api(`/api/v1/recycler/${getRecyclerId()}/transactions`);
      if (tx.length === 0) return `<div class="card"><p class="loading">No settled handovers yet</p></div>`;
      return `
        <div class="card">
          <p class="kicker">Transaction History</p>
          <h2>${tx.length} settled lot${tx.length > 1 ? "s" : ""}</h2>
          <table>
            <thead><tr><th>UTR</th><th>Lot</th><th>Weight</th><th>Amount</th><th>EPR Cert</th><th>Mode</th><th>Date</th></tr></thead>
            <tbody>
              ${tx.map(t => `
                <tr>
                  <td style="font-family:monospace;font-size:10px">${esc(t.utr_number)}</td>
                  <td style="font-family:monospace;font-size:10px">${esc(t.lot_id)}</td>
                  <td>${t.audited_weight_kg} kg</td>
                  <td><strong>${money(t.amount_paid)}</strong></td>
                  <td style="font-family:monospace;font-size:9px">${esc(t.epr_certificate_id || "—")}</td>
                  <td>${esc(t.payment_mode)}</td>
                  <td>${new Date(t.created_at).toLocaleDateString("en-IN")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  // ─── ANALYTICS TAB ───────────────────────────────────────────────────────
  async function renderAnalytics() {
    try {
      const a = await api(`/api/v1/recycler/${getRecyclerId()}/analytics`);
      return `
        <div class="kpi-grid">
          <div class="kpi" style="border-left-color:#16a34a"><div class="kpi-icon">📦</div><div class="kpi-label">Handovers</div><div class="kpi-value">${a.total_handovers}</div></div>
          <div class="kpi" style="border-left-color:#f59e0b"><div class="kpi-icon">⚖️</div><div class="kpi-label">Total Weight</div><div class="kpi-value">${a.total_kg} kg</div></div>
          <div class="kpi" style="border-left-color:#059669"><div class="kpi-icon">💰</div><div class="kpi-label">Paid Volume</div><div class="kpi-value">${money(a.total_paid_inr)}</div></div>
          <div class="kpi" style="border-left-color:#8b5cf6"><div class="kpi-icon">📊</div><div class="kpi-label">Avg ₹/kg</div><div class="kpi-value">${money(a.avg_price_per_kg)}</div></div>
          <div class="kpi" style="border-left-color:#3b82f6"><div class="kpi-icon">💼</div><div class="kpi-label">Open Offers</div><div class="kpi-value">${a.open_offers}</div><div class="kpi-sub">${a.accepted_offers} accepted</div></div>
          <div class="kpi" style="border-left-color:#f97316"><div class="kpi-icon">📥</div><div class="kpi-label">Incoming</div><div class="kpi-value">${a.incoming_lots_pending}</div><div class="kpi-sub">available lots</div></div>
        </div>
        <div class="card">
          <p class="kicker">Top Material</p>
          <h2>${esc(a.top_material || "—")}</h2>
          <p style="font-size:11px;color:var(--muted)">Highest lifetime intake by weight</p>
        </div>
      `;
    } catch (err) {
      return `<div class="card"><p class="error-msg">Could not load: ${esc(err.message)}</p></div>`;
    }
  }

  // ─── RENDER ──────────────────────────────────────────────────────────────
  async function render() {
    const el = document.getElementById("content");
    el.innerHTML = `<div class="loading">Loading…</div>`;
    let html = "";
    try {
      if (currentTab === "verify") html = renderVerify();
      else if (currentTab === "incoming") html = await renderIncoming();
      else if (currentTab === "offers") html = await renderOffers();
      else if (currentTab === "history") html = await renderHistory();
      else if (currentTab === "analytics") html = await renderAnalytics();
      el.innerHTML = html;
    } catch (err) {
      el.innerHTML = `<div class="card"><p class="error-msg">Error: ${esc(err.message)}</p></div>`;
    }
  }

  window.addEventListener("DOMContentLoaded", () => render());
</script>
</body>
</html>
